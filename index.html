  const entries=(cat==='himnos'&&indiceHimnario.length?indiceHimnario:(catalog[cat]||[]))
    .filter(s=>matchesSong(s,q))
    .slice().sort((a,b)=>alphabeticKey(a.titulo).localeCompare(alphabeticKey(b.titulo),'es',{sensitivity:'base'})||a.numero-b.numero);
  const groups=new Map();
  for(const s of entries){
    const first=alphabeticKey(s.titulo).charAt(0).toUpperCase()||'#';
    const letter=/^[A-Z]$/.test(first)?first:'#';
    if(!groups.has(letter))groups.set(letter,[]);
    groups.get(letter).push(s);
  }
  document.getElementById('list').innerHTML=[...groups].map(([letter,items])=>
    `<section class="alpha-group"><h3 class="alpha-heading">${letter}</h3>${items.map(s=>
    `<button class="index-entry" onclick="openSong(${s.numero})"><span>${esc(s.titulo)}</span><strong>${s.numero}</strong></button>`
    ).join('')}</section>`).join('')||'<p>No se encontraron cantos.</p>';
}
function renderList(alpha){
  if(alpha){renderAlphabeticIndex();return;}
  let items=(catalog[cat]||[]).slice().sort((a,b)=>a.numero-b.numero);
  const q=normalizeSearch(document.getElementById('q').value);
  items=items.filter(s=>matchesSong(s,q)&&(view!=='favorites'||isFav92(s.numero)));
  document.getElementById('list').innerHTML=items.map(s=>`<button class="item song-list-entry" onclick="openSong(${s.numero})"><span class="num">${s.numero}.</span><span class="song-list-title">${esc(s.titulo)} ›</span></button>`).join('')||'<p>No se encontraron cantos.</p>';
}

function changeSongFont(step){songFont=Math.max(.8,Math.min(1.9,Math.round((songFont+step)*100)/100));try{localStorage.setItem('idrm_song_font_'+cat,String(songFont))}catch(e){}document.querySelectorAll('.song-content').forEach(el=>el.style.fontSize=songFont+'rem');requestAnimationFrame(updateSongNavSpace)}
function updateSongNavSpace(){
 const nav=document.querySelector('body.reading .song-nav');
 if(!nav)return;
 const h=Math.ceil(nav.getBoundingClientRect().height);
 if(h>0)document.documentElement.style.setProperty('--song-nav-height',h+'px');
 // 0.8rem -> reserva pequeña; 1.9rem -> una pantalla completa + barra.
 // Cada pulsación de zoom interpola la reserva sin saltos bruscos.
 // 12 niveles: 0.8, 0.9, ..., 1.9 rem. Son exactamente 11 incrementos.
 // Distribuir la reserva total en once porciones iguales (sin saltos).
 const zoomStep=Math.max(0,Math.min(11,Math.round((songFont-.8)*10)));
 const viewport=window.innerHeight||document.documentElement.clientHeight||700;
 const minSpace=Math.max(h+30,90);
 const maxSpace=viewport+h+80;
 const space=Math.round(minSpace+(maxSpace-minSpace)*zoomStep/11);
 document.documentElement.style.setProperty('--song-tail-space',space+'px');
}

const NOTES_KEY='idrm_bible_notes_v1';

function getNotes(){try{let a=JSON.parse(localStorage.getItem(NOTES_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function storeNotes(a){try{localStorage.setItem(NOTES_KEY,JSON.stringify(a));return true}catch(e){alert('No fue posible guardar. Revisa el espacio disponible en tu teléfono.');return false}}
function noteDate(v){try{return new Date(v).toLocaleDateString('es-MX',{year:'numeric',month:'short',day:'numeric'})}catch(e){return ''}}

function importNotes(){if(window.IDRM?.importNotes)window.IDRM.importNotes();else alert('Disponible en la aplicación Android.');}
function receiveNotesBackup(text){try{const data=JSON.parse(text);if(data.format==='IDRM-respaldo'){restore92(data);return;}if(data.format!=='IDRM-apuntes'||data.version!==1||!Array.isArray(data.notes)||data.notes.length>10000)throw Error();const incoming=data.notes;if(!incoming.every(n=>n&&typeof n.title==='string'&&n.title.trim()&&typeof n.body==='string'&&n.body.trim()))throw Error();const all=getNotes();const keys=new Set(all.map(n=>JSON.stringify([n.title,n.body])));let count=0;for(const n of incoming){const key=JSON.stringify([n.title,n.body]);if(keys.has(key))continue;keys.add(key);all.push({id:'n'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+count,title:n.title,body:n.body,updated:Number.isFinite(n.updated)?n.updated:Date.now()});count++;}if(!count)return alert('No hay apuntes nuevos.');if(!confirm('¿Importar '+count+' apuntes nuevos? Se conservarán tus apuntes actuales.'))return;if(storeNotes(all)){openNotes();alert('Apuntes importados: '+count);}}catch(e){alert('El archivo no es un respaldo válido de IDRM.');}}
function renderNotes(){view='bible-notes';document.body.classList.remove('reading');let notes=getNotes().sort((a,b)=>b.updated-a.updated);$.innerHTML=`<div class="bar notes-header"><button class="notes-back-btn" onclick="notesBack92()" aria-label="Regresar">←</button><h2 class="notes-header-title">APUNTES</h2><div class="notes-top-actions"><button class="notes-top-add" onclick="editNote()" aria-label="Crear nuevo apunte" title="Nuevo apunte">＋</button>${themeButton()}</div></div><p class="hint">Selecciona uno o varios temas para exportarlos juntos. Usa ABRIR para leer o editar.</p><div class="notes-actions"><button id="notes-export" onclick="exportNotes()">EXPORTAR (${selectedNotes.size})</button><button onclick="importNotes()">IMPORTAR</button></div><div class="notes-list">${notes.map(n=>`<div class="item notes-item"><label class="note-select-label"><input type="checkbox" ${selectedNotes.has(n.id)?'checked':''} onchange="toggleNoteSelection('${n.id}',this.checked)"><span><span class="notes-title">${esc(n.title)}</span><span class="notes-date">Actualizado: ${noteDate(n.updated)}</span></span></label><button class="note-open-btn" onclick="viewNote('${n.id}')">ABRIR ›</button></div>`).join('')||'<p class="hint center">Todavía no hay apuntes guardados.</p>'}</div><div class="notes-actions"><button id="notes-send-selected" onclick="shareSelectedNotes()" ${selectedNotes.size?'':'disabled'}>↗ ENVIAR SELECCIONADOS (${selectedNotes.size})</button><button onclick="selectAllNotes()">SELECCIONAR TODOS</button><button onclick="selectedNotes.clear();renderNotes()">LIMPIAR SELECCIÓN</button></div>`}

let bibleHoldTimer=null,bibleHoldX=0,bibleHoldY=0,bibleHoldFired=false;

function initBibleLongPress(){
  const area=document.querySelector('.bible-verses');if(!area)return;
  area.addEventListener('pointerdown',e=>{
    if(e.button!==0||!e.isPrimary)return;
    const target=e.target.closest('[data-bible-verse]');if(!target)return;
    cancelBibleHold();bibleHoldFired=false;bibleHoldX=e.clientX;bibleHoldY=e.clientY;
    const n=Number(target.dataset.bibleVerse),id=Number(area.dataset.book),ch=Number(area.dataset.chapter);
    bibleHoldTimer=setTimeout(()=>{bibleHoldTimer=null;bibleHoldFired=true;bibleActionMenu(id,ch,n)},1000);
  });
  area.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-bibleHoldX)>12||Math.abs(e.clientY-bibleHoldY)>12)cancelBibleHold()});

/* Apple R3: reponer la barrera después de cada retroceso, incluso
   si el navegador entrega un estado nulo o de una revisión anterior. */
(function(){
 const key='idrmAppleBackR3';
 let busy=false;
 function arm(force=false){
   if(!force && history.state?.[key]==='guard')return;
   try{
     history.replaceState({[key]:'base'},'',location.href);
     history.pushState({[key]:'guard'},'',location.href);
   }catch(e){console.warn('Historial IDRM',e);}
 }
 function closeOrBack(){
   if(document.getElementById('bible-action-overlay')){idrmBack();return;}
   for(const id of ['locator-choice','bible-locator','minister-contact-overlay','idrm-confirm']){
     const el=document.getElementById(id);if(el){el.remove();return;}
   }
   if(view!=='home')idrmBack();
 }
 // Una entrada inicial y renovación durante interacciones reales.
 arm();
 let interacted=false;
 function activate(){if(!interacted){interacted=true;arm(true);}else arm();}
 for(const type of ['pointerdown','touchend','click','keydown'])
   document.addEventListener(type,activate,{capture:true,passive:true});
 window.addEventListener('pageshow',()=>arm());
 window.addEventListener('popstate',()=>{
   if(busy)return;
   busy=true;
   try{arm(true);closeOrBack();}finally{busy=false;}
 });
})();
